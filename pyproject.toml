[tool.ruff]
line-length = 95

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "C901",    # allow complex functions
  "COM812",  # missing-trailing-comma (conflicts with ruff formatter)
  "CPY001",  # copyright notice not required
  "D205",    # 1 blank line required between summary and description
  "EM101",   # allow string literal in exception
  "EM102",   # allow f-string literal in exception
  "INP001",  # script dirs are not packages (no __init__.py)
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PTH",     # prefer os.path over pathlib per project convention
  "S603",    # subprocess call with trusted local input
  "SIM905",  # allow "-a b -c".split() for argv flags, reads like the shell command
  "T201",    # allow print in CLI scripts
  "TRY003",  # allow long messages outside exception class
  "TRY301",  # allow raise within try block
]
pydocstyle.convention = "google"
isort.split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"] # allow assert in pytest tests

# Scripts are standalone files, not a package: put their dirs on the import path.
[tool.pytest.ini_options]
pythonpath = ["scripts", "agents/skills/address-local-coderabbit-comments/scripts"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["scripts", "agents/skills/address-local-coderabbit-comments/scripts"]

[tool.typos.default.extend-words]
atomate = "atomate"
AIMD = "AIMD"
ATOMATE = "ATOMATE"

[tool.typos.files]
extend-exclude = ["dotfiles/text-replacements.json"] # base64 values
