# Encode the GitHub account in each repository's SSH remote:
# git@github-janosh:owner/repo.git or git@github-janosh-per:owner/repo.git.
Host github-*
  HostName github.com
  User git
  IdentitiesOnly yes
  AddKeysToAgent yes
  UseKeychain yes

Host github-janosh
  IdentityFile ~/.ssh/id_ed25519_janosh

Host github-janosh-per
  IdentityFile ~/.ssh/id_ed25519
